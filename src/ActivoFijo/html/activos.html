<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E3228">
    <title>Activo Fijo - Inventario</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../css/activos.css">
</head>
<body>

    <!-- HERO / HEADER GLOBAL -->
    <header class="header-global">
        <div class="header-inner">
            <button id="btn-volver" class="btn-back" aria-label="Volver al menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Volver</span>
            </button>

            <div class="header-titles">
                <h1>Inventario de Activos Fijos</h1>
                <p>Consulta y administra el parque de equipos</p>
            </div>

            <button id="btn-nuevo" class="btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>Nuevo activo</span>
            </button>
        </div>
    </header>

    <!-- BARRA DE BÚSQUEDA + TABS VISTA -->
    <div class="toolbar">
        <div class="buscador">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="input-busqueda"
                   placeholder="Buscar por serie, IMEI, teléfono, modelo, marca, tipo, estado, cartera, sitio, usuario...">
            <button type="button" id="btn-limpiar-busqueda" class="btn-limpiar oculto" title="Limpiar búsqueda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="tabs-vista" id="tabs-vista" role="tablist">
            <button class="tab-vista activo" data-vista="activos" role="tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                Activos
            </button>
            <button class="tab-vista" data-vista="eliminados" role="tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6M14 11v6"></path>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
                Eliminados (BAJA)
            </button>
        </div>
    </div>

    <!-- ESTADO VACÍO -->
    <div id="sin-resultados" class="empty-state oculto">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>
        <h3 id="sin-resultados-titulo">Sin resultados</h3>
        <p id="sin-resultados-texto">No se encontraron activos con ese criterio.</p>
        <button type="button" id="btn-limpiar-busqueda-vacio" class="btn-ghost">Limpiar búsqueda</button>
    </div>

    <!-- TABLA -->
    <main class="tabs-main">
        <div class="card-tabla" id="card-tabla">
            <table class="data-table tabla-activos">
                <thead>
                    <tr>
                        <th>Serie / IMEI / Teléfono</th>
                        <th>Marca / Modelo</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Estatus</th>
                        <th style="width:160px; text-align:right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>
    </main>

    <!-- =========================================================
         MODAL NUEVO / EDITAR
         Estructura flex correcta:
         .modal-base (flex column, altura limitada)
           .modal-header (fijo arriba)
           form (flex 1, min-height 0, flex column)
             .modal-body (overflow-y auto, flex 1)
             .modal-footer (fijo abajo)
         ========================================================= -->
    <div id="modal-activo" class="modal-overlay" style="display:none;">
        <div class="modal-base">
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-header-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </div>
                    <h3 id="modal-titulo">Nuevo activo</h3>
                </div>
                <button type="button" id="modal-cerrar" class="btn-cerrar-modal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <form id="formulario" class="modal-form" autocomplete="off">
                <div class="modal-body">
                    <div class="grid-form">

                        <div class="seccion-titulo campo-full">Identificación</div>

                        <div class="campo-item">
                            <label for="tipo">Tipo <span class="req">*</span></label>
                            <select id="tipo" required></select>
                        </div>
                        <div class="campo-item">
                            <label for="marca">Marca</label>
                            <select id="marca"><option value="">— Sin marca —</option></select>
                        </div>
                        <div class="campo-item">
                            <label for="modelo">Modelo</label>
                            <input type="text" id="modelo" maxlength="150" placeholder="Ej. HP ProDesk 400 G4">
                        </div>
                        <div class="campo-item">
                            <label for="noserie">No. Serie</label>
                            <input type="text" id="noserie" maxlength="150" placeholder="Ej. 8CC9253DXK">
                        </div>

                        <div class="campo-item campo-full campo-imei1 oculto">
                            <label for="imei1">IMEI 1</label>
                            <input type="text" id="imei1" maxlength="50" placeholder="15 dígitos">
                        </div>
                        <div class="campo-item campo-full campo-imei2 oculto">
                            <label for="imei2">IMEI 2</label>
                            <input type="text" id="imei2" maxlength="50" placeholder="15 dígitos">
                        </div>
                        <div class="campo-item campo-full campo-telefono oculto">
                            <label for="notelefono">No. Teléfono</label>
                            <input type="text" id="notelefono" maxlength="50" placeholder="Ej. 5646448174">
                        </div>

                        <div class="seccion-titulo campo-full">Ubicación y clasificación</div>

                        <div class="campo-item campo-sitio">
                            <label for="sitio">Sitio</label>
                            <select id="sitio"><option value="">— Sin sitio —</option></select>
                        </div>
                        <div class="campo-item campo-subtipo">
                            <label for="subtipo">Subtipo</label>
                            <select id="subtipo" disabled><option value="">— Selecciona un tipo primero —</option></select>
                        </div>
                        <div class="campo-item campo-clasificacion">
                            <label for="clasificacion">Clasificación</label>
                            <select id="clasificacion"><option value="">— Sin clasificación —</option></select>
                        </div>
                        <div class="campo-item campo-tamanio">
                            <label for="tamanio">Tamaño</label>
                            <select id="tamanio"><option value="">— Sin tamaño —</option></select>
                        </div>
                        <div class="campo-item campo-capacidad">
                            <label for="capacidad">Capacidad</label>
                            <select id="capacidad"><option value="">— Sin capacidad —</option></select>
                        </div>
                        <div class="campo-item campo-voltaje">
                            <label for="voltaje">Voltaje</label>
                            <select id="voltaje"><option value="">— Sin voltaje —</option></select>
                        </div>
                        <div class="campo-item campo-full campo-usuario-asignado oculto">
                            <label for="usuario-asignado">Usuario asignado</label>
                            <input type="text" id="usuario-asignado" maxlength="200" placeholder="Nombre completo del usuario externo">
                        </div>

                        <div class="seccion-titulo campo-full">Situación</div>

                        <div class="campo-item">
                            <label for="estado">Estado <span class="req">*</span></label>
                            <select id="estado" required></select>
                        </div>
                        <div class="campo-item">
                            <label for="estatus">Estatus <span class="req">*</span></label>
                            <select id="estatus" required></select>
                        </div>
                        <div class="campo-item">
                            <label for="cartera">Cartera</label>
                            <select id="cartera"><option value="">— Sin cartera —</option></select>
                        </div>
                        <div class="campo-item campo-precio oculto">
                            <label for="precio">Precio</label>
                            <input type="number" id="precio" step="0.01" min="0" placeholder="0.00">
                        </div>

                        <div class="seccion-titulo campo-full bloque-especificaciones oculto">Especificaciones técnicas</div>

                        <div class="campo-item bloque-especificaciones oculto">
                            <label for="procesador">Procesador</label>
                            <input type="text" id="procesador" maxlength="150" placeholder="Ej. Intel Core i5-8500T">
                        </div>
                        <div class="campo-item bloque-especificaciones oculto">
                            <label for="ram">Memoria RAM</label>
                            <input type="text" id="ram" maxlength="50" placeholder="Ej. 8 GB">
                        </div>
                        <div class="campo-item bloque-especificaciones oculto">
                            <label for="almacenamiento">Almacenamiento</label>
                            <input type="text" id="almacenamiento" maxlength="50" placeholder="Ej. 240 GB SSD">
                        </div>
                        <div class="campo-item bloque-especificaciones oculto">
                            <label for="so">Sistema Operativo</label>
                            <input type="text" id="so" maxlength="100" placeholder="Ej. Windows 11 Pro">
                        </div>

                        <div class="campo-item campo-full campo-accesorios oculto">
                            <label for="accesorios">Accesorios</label>
                            <input type="text" id="accesorios" maxlength="300" placeholder="Ej. Cargador, cable USB">
                        </div>

                        <div class="campo-item campo-full">
                            <label for="observaciones">Observaciones</label>
                            <textarea id="observaciones" maxlength="500" rows="3" placeholder="Notas adicionales"></textarea>
                        </div>
                    </div>

                    <div id="mensaje" class="alert oculto"></div>
                </div>

                <div class="modal-footer">
                    <button type="submit" id="btn-guardar" class="btn-primary">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/activos-renderer.js"></script>
</body>
</html>
