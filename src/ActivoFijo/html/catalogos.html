<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E3228">
    <title>Catálogos · Activo Fijo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../css/catalogos.css">
</head>
<body>

    <!-- HEADER GLOBAL -->
    <header class="header-global">
        <div class="header-inner">
            <button id="btn-volver" class="btn-back" aria-label="Volver al menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Volver</span>
            </button>

            <div class="header-titles">
                <h1 id="titulo-catalogo">Catálogos · Activo Fijo</h1>
                <p>Configuración maestra del inventario</p>
            </div>
        </div>
    </header>

    <!-- TABS DE CATÁLOGOS -->
    <nav class="tabs-nav" id="tabs-catalogos" role="tablist">
        <button class="tab activo" data-catalogo="marcas" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            <span>Marcas</span>
        </button>
        <button class="tab" data-catalogo="tipos" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            <span>Tipos</span>
        </button>
        <button class="tab" data-catalogo="estados" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Estados</span>
        </button>
        <button class="tab" data-catalogo="estatus" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>Estatus</span>
        </button>
        <button class="tab" data-catalogo="carteras" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <span>Carteras</span>
        </button>
        <button class="tab" data-catalogo="puestos" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Puestos</span>
        </button>
        <button class="tab" data-catalogo="sitios" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 21h18"/>
                <path d="M5 21V7l8-4v18"/>
                <path d="M19 21V11l-6-4"/>
            </svg>
            <span>Sitios</span>
        </button>
        <button class="tab" data-catalogo="subtipos" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
            </svg>
            <span>Subtipos</span>
        </button>
        <button class="tab" data-catalogo="voltajes" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span>Voltajes</span>
        </button>
        <button class="tab" data-catalogo="clasificaciones" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>Clasificaciones</span>
        </button>
        <button class="tab" data-catalogo="tamanios" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
            </svg>
            <span>Tamaños</span>
        </button>
        <button class="tab" data-catalogo="capacidades" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
            <span>Capacidades</span>
        </button>
    </nav>

    <!-- SUBNAV VISTA -->
    <div class="subnav-bar">
        <div class="tabs-vista" id="tabs-vista" role="tablist">
            <button class="tab-vista activo" data-vista="activos" role="tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
                Activos
            </button>
            <button class="tab-vista" data-vista="eliminados" role="tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
                Eliminados
            </button>
        </div>
    </div>

    <!-- PANEL AYUDA -->
    <div class="panel-ayuda" id="panel-ayuda">
        <div class="panel-ayuda-header">
            <div class="panel-ayuda-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            </div>
            <h3 id="panel-ayuda-titulo" class="panel-ayuda-titulo">Cómo funciona</h3>
            <button id="btn-toggle-ayuda" class="panel-ayuda-toggle" aria-label="Mostrar/ocultar ayuda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
        <div class="panel-ayuda-body" id="panel-ayuda-body"></div>
    </div>

    <!-- MAIN -->
    <main class="tabs-main">
        <div class="panel-header">
            <div class="panel-title">
                <h2 id="panel-titulo">Catálogo</h2>
                <p id="panel-descripcion">Gestiona los registros del catálogo seleccionado</p>
            </div>
            <div class="panel-actions">
                <div class="buscador">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="input-busqueda" placeholder="Buscar registros...">
                    <button type="button" id="btn-limpiar-busqueda" class="btn-clear oculto" title="Limpiar búsqueda">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <button id="btn-nuevo" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span id="btn-nuevo-texto">Nuevo registro</span>
                </button>
            </div>
        </div>

        <div id="sin-resultados" class="empty-state oculto">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </div>
            <h3 id="sin-resultados-titulo">Sin resultados</h3>
            <p id="sin-resultados-texto">No se encontraron registros con ese criterio.</p>
            <button type="button" id="btn-limpiar-filtro" class="btn-ghost">Limpiar búsqueda</button>
        </div>

        <div class="card-tabla" id="card-tabla">
            <table class="data-table">
                <thead id="tabla-head"></thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modal-catalogo" class="modal-overlay" style="display:none;">
        <form id="formulario" class="modal-base" autocomplete="off" novalidate>
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-header-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </div>
                    <h3 id="modal-titulo">Nuevo registro</h3>
                </div>
                <button type="button" id="modal-cerrar" class="btn-cerrar-modal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="aviso-modal" class="aviso oculto"></div>
                <div id="campos-form" class="grid-form"></div>
                <div id="mensaje" class="alert oculto"></div>
            </div>
            <div class="modal-footer">
                <button type="submit" id="btn-guardar" class="btn-primary">
                    <span class="btn-text">Guardar</span>
                    <span class="btn-spinner oculto"></span>
                </button>
            </div>
        </form>
    </div>

    <script src="../js/catalogos-renderer.js"></script>
</body>
</html>
