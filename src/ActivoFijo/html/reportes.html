<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E3228">
    <title>Activo Fijo · Reportes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../css/reportes.css">
</head>
<body>

    <!-- HERO -->
    <header class="header-global">
        <div class="header-inner">
            <button id="btn-volver" class="btn-back" aria-label="Volver al menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Volver</span>
            </button>

            <div class="header-titles">
                <h1>Reportes de Activo Fijo</h1>
                <p>Análisis, métricas y exportación de datos</p>
            </div>

            <div class="header-actions">
                <button id="btn-recargar" class="btn-icon" title="Recargar datos" aria-label="Recargar datos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
                <button id="btn-exportar" class="btn-primary" title="Exportar vista actual a Excel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Exportar Excel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- KPIs -->
    <section class="kpis-grid" id="kpis-grid">
        <div class="kpi-card kpi-total">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Total activos</div>
                <div class="kpi-valor" id="kpi-total">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-valor">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Valor total</div>
                <div class="kpi-valor" id="kpi-valor">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-stock">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3h18v18H3z"></path>
                    <path d="M3 9h18"></path>
                    <path d="M9 21V9"></path>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">En stock</div>
                <div class="kpi-valor" id="kpi-stock">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-disponible">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Disponibles</div>
                <div class="kpi-valor" id="kpi-disponible">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-asignado">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Asignados</div>
                <div class="kpi-valor" id="kpi-asignado">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-pendiente">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Pendientes</div>
                <div class="kpi-valor" id="kpi-pendiente">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-baja">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Bajas</div>
                <div class="kpi-valor" id="kpi-baja">—</div>
            </div>
        </div>

        <div class="kpi-card kpi-responsivas">
            <div class="kpi-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-label">Responsivas activas</div>
                <div class="kpi-valor" id="kpi-responsivas">—</div>
            </div>
        </div>
    </section>

    <!-- TABS -->
    <nav class="tabs-reportes" id="tabs-reportes" role="tablist">
        <button class="tab activo" data-vista="resumen-tipo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Por Tipo</span>
        </button>
        <button class="tab" data-vista="resumen-cartera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span>Por Cartera</span>
        </button>
        <button class="tab" data-vista="inventario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span>Inventario</span>
        </button>
        <button class="tab" data-vista="responsivas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>Responsivas</span>
        </button>
        <button class="tab" data-vista="personas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Por Persona</span>
        </button>
        <button class="tab" data-vista="tickets">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                <path d="M18 12a2 2 0 0 0 0 4h4v-4z"></path>
            </svg>
            <span>Por Ticket</span>
        </button>
        <button class="tab" data-vista="celulares">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <span>Celulares</span>
        </button>
        <button class="tab" data-vista="laptops">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 16V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12"></path>
                <path d="M2 20h20"></path>
            </svg>
            <span>Laptops</span>
        </button>
    </nav>

    <!-- FILTROS GLOBALES -->
    <div class="filtros oculto" id="filtros-dinamicos">
        <div class="filtro" id="filtro-tipo-wrap">
            <label for="filtro-tipo">Tipo</label>
            <select id="filtro-tipo"><option value="">Todos</option></select>
        </div>
        <div class="filtro" id="filtro-estado-wrap">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado"><option value="">Todos</option></select>
        </div>
        <div class="filtro" id="filtro-estatus-wrap">
            <label for="filtro-estatus">Estatus</label>
            <select id="filtro-estatus"><option value="">Todos</option></select>
        </div>
        <div class="filtro" id="filtro-cartera-wrap">
            <label for="filtro-cartera">Cartera</label>
            <select id="filtro-cartera"><option value="">Todas</option></select>
        </div>
        <button id="btn-limpiar-filtros" class="btn-icon" title="Limpiar filtros" aria-label="Limpiar filtros">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        </button>
    </div>

    <!-- BARRA INFO TABLA -->
    <div class="tabla-toolbar">
        <div class="tabla-info">
            <span id="tabla-titulo">Resumen por Tipo</span>
            <span class="tabla-count" id="tabla-count">0 registros</span>
        </div>
        <div class="buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="input-busqueda" placeholder="Buscar en la tabla actual...">
            <button type="button" id="btn-limpiar-busqueda" class="btn-clear oculto" title="Limpiar búsqueda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <button id="btn-limpiar-filtros-col" class="btn-icon oculto" title="Limpiar filtros de columna" aria-label="Limpiar filtros de columna">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- ESTADO DE CARGA -->
    <div id="cargando" class="cargando oculto">
        <div class="spinner"></div>
        <p>Cargando reporte...</p>
    </div>

    <!-- ESTADO VACÍO -->
    <div id="sin-resultados" class="empty-state oculto">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>
        <h3>Sin resultados</h3>
        <p id="sin-resultados-texto">No hay datos para mostrar en este reporte.</p>
        <button type="button" id="btn-limpiar-todo" class="btn-ghost">Limpiar filtros</button>
    </div>

    <!-- TABLA DINÁMICA -->
    <div class="card-tabla oculto" id="card-tabla">
        <table class="tabla-reportes">
            <thead id="tabla-head"></thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>

    <script src="../js/reportes-renderer.js"></script>
</body>
</html>
