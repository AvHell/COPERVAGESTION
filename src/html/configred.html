<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuraciones de Red</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- SweetAlert2 por CDN (versión flotante 11) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Estilos autocontenidos -->
    <link rel="stylesheet" href="../css/configred.css">
</head>
<body>

    <!-- =========================================================
         BARRA SUPERIOR
         ========================================================= -->
    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver al menú
        </button>
        <button id="btn-nueva">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nueva configuración
        </button>
    </div>

    <h2>Configuraciones de Red</h2>
    <p class="subtitulo-seccion">Catálogo de valores sugeridos por cliente (máscaras, puertas de enlace, DNS).</p>

    <!-- =========================================================
         FILTROS
         ========================================================= -->
    <div class="filtros">
        <div>
            <label for="filtro-cliente">Cliente</label>
            <select id="filtro-cliente"></select>
        </div>
        <div>
            <label for="filtro-tipo">Tipo</label>
            <select id="filtro-tipo">
                <option value="">Todos</option>
                <option value="Mascara">Máscara</option>
                <option value="PuertaEnlace">Puerta de enlace</option>
                <option value="DNS1">DNS 1</option>
                <option value="DNS2">DNS 2</option>
            </select>
        </div>
        <div>
            <label for="filtro-busqueda">Buscar</label>
            <input type="text" id="filtro-busqueda" placeholder="Valor o descripción...">
        </div>
    </div>

    <!-- =========================================================
         ESTADO VACÍO
         ========================================================= -->
    <div id="sin-resultados" class="sin-resultados oculto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No se encontraron configuraciones con ese criterio.</p>
    </div>

    <!-- =========================================================
         CONTENEDOR DE GRUPOS (por cliente)
         ========================================================= -->
    <div id="contenedor-grupos"></div>

    <script src="../js/configred-renderer.js"></script>
</body>
</html>
