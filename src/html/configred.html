<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuraciones de Red</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/configred.css">
</head>
<body>
    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver al menú
        </button>
        <button id="btn-nueva">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nueva configuración
        </button>
    </div>

    <h2>Configuraciones de Red</h2>
    <p class="subtitulo-seccion">Catálogo de valores sugeridos por cliente (máscaras, puertas de enlace, DNS).</p>

    <div class="filtros">
        <div>
            <label for="filtro-cliente">Cliente</label>
            <select id="filtro-cliente"></select>
        </div>
        <div>
            <label for="filtro-tipo">Tipo</label>
            <select id="filtro-tipo">
                <option value="">Todos</option>
                <option value="Mascara">Máscara</option>
                <option value="PuertaEnlace">Puerta de enlace</option>
                <option value="DNS1">DNS 1</option>
                <option value="DNS2">DNS 2</option>
            </select>
        </div>
        <div>
            <label for="filtro-busqueda">Buscar</label>
            <input type="text" id="filtro-busqueda" placeholder="Valor o descripción...">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Descripción</th>
                <th style="width:180px;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-config"></tbody>
    </table>

    <script src="../../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="../js/configred-renderer.js"></script>
</body>
</html>
