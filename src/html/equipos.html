<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- SweetAlert2 por CDN (versión flotante 11) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Estilos autocontenidos -->
    <link rel="stylesheet" href="../css/equipos.css">
</head>
<body>

    <!-- =========================================================
         BARRA SUPERIOR
         ========================================================= -->
    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver al menú
        </button>

        <div class="buscador">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="input-busqueda" placeholder="Buscar por hostname, cliente, lugar, rol o IP...">
            <button type="button" id="btn-limpiar-busqueda" class="btn-limpiar oculto" title="Limpiar búsqueda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <button id="btn-nuevo">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nuevo equipo
        </button>
    </div>

    <h2>Equipos</h2>

    <!-- =========================================================
         ESTADO VACÍO
         ========================================================= -->
    <div id="sin-resultados" class="sin-resultados oculto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No se encontraron equipos con ese criterio.</p>
        <button type="button" id="btn-limpiar-filtro" class="secundario">Limpiar búsqueda</button>
    </div>

    <!-- =========================================================
         CONTENEDOR DE GRUPOS (por cliente y lugar)
         ========================================================= -->
    <div id="contenedor-grupos"></div>

    <!-- =========================================================
         MODAL DE EQUIPO
         ========================================================= -->
    <div id="modal-equipo" class="modal-overlay" style="display:none;">
        <div class="modal-grande">
            <div class="modal-header">
                <h3 id="modal-equipo-titulo">Nuevo equipo</h3>
                <button id="modal-equipo-cerrar" class="btn-cerrar-modal" title="Cerrar">✕</button>
            </div>

            <div class="modal-body">

                <div class="seccion-titulo">Ubicación y rol</div>
                <div class="grid-form">
                    <div>
                        <label for="cliente">Cliente *</label>
                        <select id="cliente"></select>
                    </div>
                    <div>
                        <label for="lugar">Lugar *</label>
                        <select id="lugar"></select>
                    </div>
                    <div>
                        <label for="rol">Rol *</label>
                        <select id="rol"></select>
                    </div>
                </div>

                <div class="seccion-titulo">Tipo de dirección</div>
                <div class="grid-form">
                    <div>
                        <label for="tipoIP">Tipo IP *</label>
                        <select id="tipoIP">
                            <option value="Estatica">Estática</option>
                            <option value="DHCP">DHCP</option>
                        </select>
                    </div>
                    <div id="campoHostnameEstatico">
                        <label for="hostnamePreview">Hostname *</label>
                        <input type="text" id="hostnamePreview" readonly placeholder="Se armará automáticamente...">
                    </div>
                    <div id="campoHostnameDHCP" class="campo-oculto">
                        <label for="hostnameLibre">Hostname (libre) *</label>
                        <input type="text" id="hostnameLibre" placeholder="Escribe el hostname...">
                    </div>
                </div>

                <div id="filaCheckboxHostname" class="fila-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chk-hostname-manual">
                        <span>Generar hostname manualmente</span>
                    </label>
                    <span class="ayuda-checkbox">Marca esta opción si quieres escribir el hostname tú mismo.</span>
                </div>

                <div id="bloqueEstatico">
                    <div class="seccion-titulo">Datos estáticos</div>
                    <div class="grid-form">
                        <div>
                            <label for="ip">IP *</label>
                            <input type="text" id="ip" placeholder="192.168.111.178" inputmode="numeric">
                        </div>
                        <div>
                            <label for="numeroHost">Número Host</label>
                            <input type="number" id="numeroHost" readonly>
                        </div>
                    </div>
                </div>

                <div class="seccion-titulo">Red</div>
                <div class="grid-form col4">
                    <div>
                        <label for="mascara">Máscara *</label>
                        <div class="select-con-boton">
                            <select id="mascara" disabled></select>
                            <button type="button" class="btn-agregar-mini" data-tipo="Mascara" data-target="mascara" title="Agregar nueva máscara">+</button>
                        </div>
                    </div>
                    <div>
                        <label for="puertaEnlace">Puerta de enlace *</label>
                        <div class="select-con-boton">
                            <select id="puertaEnlace" disabled></select>
                            <button type="button" class="btn-agregar-mini" data-tipo="PuertaEnlace" data-target="puertaEnlace" title="Agregar nueva puerta de enlace">+</button>
                        </div>
                    </div>
                    <div>
                        <label for="dns1">DNS 1 *</label>
                        <div class="select-con-boton">
                            <select id="dns1" disabled></select>
                            <button type="button" class="btn-agregar-mini" data-tipo="DNS1" data-target="dns1" title="Agregar nuevo DNS 1">+</button>
                        </div>
                    </div>
                    <div>
                        <label for="dns2">DNS 2 (opcional)</label>
                        <div class="select-con-boton">
                            <select id="dns2" disabled></select>
                            <button type="button" class="btn-agregar-mini" data-tipo="DNS2" data-target="dns2" title="Agregar nuevo DNS 2">+</button>
                        </div>
                    </div>
                </div>

                <div class="seccion-titulo">Administración</div>
                <div class="grid-form col2">
                    <div>
                        <label for="dominio">Dominio / Usuario admin *</label>
                        <div class="select-con-boton">
                            <select id="dominio" disabled></select>
                            <button type="button" id="btn-nuevo-dominio" class="btn-agregar-mini" title="Agregar nuevo dominio">+</button>
                        </div>
                    </div>
                    <div>
                        <label for="passwordAdmin">Password admin *</label>
                        <input type="text" id="passwordAdmin" placeholder="P@ssw0rd">
                    </div>
                </div>

                <div id="mensaje" class="mensaje oculto"></div>
            </div>

            <div class="modal-footer">
                <button id="btn-cancelar" class="secundario">Cancelar</button>
                <button id="btn-guardar">
                    <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <script src="../js/equipos-renderer.js"></script>
</body>
</html>
