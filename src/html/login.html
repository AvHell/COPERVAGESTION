<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos autocontenidos -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <!-- =========================================================
         TARJETA DE LOGIN
         ========================================================= -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Header con logo -->
            <div class="login-header">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <h1>Inventario de Equipos</h1>
                <p class="subtitulo">Inicia sesión para continuar</p>
            </div>

            <!-- Formulario -->
            <form id="form-login" autocomplete="off">

                <!-- Campo Usuario -->
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="usuario" placeholder="admin" autofocus required>
                    </div>
                </div>

                <!-- Campo Password -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="btn-toggle-password" class="btn-toggle-password"
                                title="Mostrar contraseña" aria-label="Mostrar contraseña">
                            <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icono-ojo-cerrado oculto" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                 stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Botón Login -->
                <button type="submit" id="btn-login" class="btn-login">
                    <span class="btn-text">Entrar</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>

                <!-- Mensaje -->
                <div id="mensaje" class="mensaje oculto"></div>
            </form>
        </div>
    </div>

    <script src="../js/login-renderer.js"></script>
</body>
</html>
