<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pisos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../css/lugares.css">
</head>
<body>

    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver al menú
        </button>

        <div class="buscador">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="input-busqueda" placeholder="Buscar piso o cliente...">
            <button type="button" id="btn-limpiar-busqueda" class="btn-limpiar oculto" title="Limpiar búsqueda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <button id="btn-nuevo">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nuevo piso
        </button>
    </div>

    <h2>Pisos</h2>

    <div id="sin-resultados" class="sin-resultados oculto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No se encontraron pisos con ese criterio.</p>
        <button type="button" id="btn-limpiar-filtro" class="secundario">Limpiar búsqueda</button>
    </div>

    <div id="contenedor-grupos"></div>

    <div id="modal-lugar" class="modal-overlay" style="display:none;">
        <div class="modal-lugar">
            <div class="modal-header">
                <h3 id="modal-lugar-titulo">Nuevo piso</h3>
                <button id="modal-lugar-cerrar" class="btn-cerrar-modal" title="Cerrar">✕</button>
            </div>

            <form id="formulario" autocomplete="off">
                <div class="modal-body">
                    <div class="grid-form">
                        <div>
                            <label for="nombre">Nombre del piso *</label>
                            <input type="text" id="nombre" maxlength="100" placeholder="Ej. Piso 3" required>
                        </div>
                        <div>
                            <label for="filas">Filas *</label>
                            <input type="number" id="filas" min="1" max="50" value="8" required>
                        </div>
                        <div>
                            <label for="columnas">Columnas *</label>
                            <input type="number" id="columnas" min="1" max="50" value="12" required>
                        </div>
                    </div>

                    <div class="seccion-titulo" style="margin-top:14px;">Clientes con acceso al piso</div>
                    <div id="lista-clientes-check" class="lista-clientes-check"></div>

                    <div id="mensaje" class="mensaje oculto"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-cancelar" class="secundario">Cancelar</button>
                    <button type="submit" id="btn-guardar">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/lugares-renderer.js"></script>
</body>
</html>
