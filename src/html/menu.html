<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <!-- =========================================================
         HEADER CORPORATIVO
         ========================================================= -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Inventario de Equipos</h1>
                    <p>Sistema de gestión de red</p>
                </div>
            </div>

            <div class="user-card" id="user-card">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Cargando…</div>
                    <div class="user-role" id="user-role">—</div>
                </div>
                <button id="btn-salir" class="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Salir</span>
                </button>
            </div>
        </div>
    </header>

    <!-- =========================================================
         GREETING
         ========================================================= -->
    <section class="greeting">
        <div class="greeting-text">
            <h2 id="saludo">Bienvenido</h2>
            <p id="bienvenida">Selecciona un módulo para comenzar</p>
        </div>
        <div class="greeting-date" id="fecha-hoy"></div>
    </section>

    <!-- =========================================================
         CATEGORÍA: MAPEO RED Y PLANO
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line" data-color="azul"></div>
            <h3>Mapeo Red y Plano</h3>
            <span class="categoria-badge">4 módulos</span>
        </div>

        <div class="modulos-grid">

            <!-- Catálogos -->
            <button class="modulo-card" data-modulo="catalogos" data-color="azul"
                    aria-label="Abrir Catálogos del Sistema">
                <div class="modulo-icono" data-color="azul">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                        <circle cx="7" cy="6" r="1.5"/>
                        <circle cx="7" cy="12" r="1.5"/>
                        <circle cx="7" cy="18" r="1.5"/>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Catálogos del Sistema</div>
                    <div class="modulo-desc">Clientes, pisos, roles, dominios y red</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Equipos -->
            <button class="modulo-card" data-modulo="equipos" data-color="cian"
                    aria-label="Abrir Equipos">
                <div class="modulo-icono" data-color="cian">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Equipos</div>
                    <div class="modulo-desc">Inventario técnico de red</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Plano Visual -->
            <button class="modulo-card" data-modulo="plano" data-color="violeta"
                    aria-label="Abrir Plano Visual">
                <div class="modulo-icono" data-color="violeta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Plano Visual</div>
                    <div class="modulo-desc">Mapa gráfico de equipos</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Histórico -->
            <button class="modulo-card" data-modulo="historico" data-color="gris"
                    aria-label="Abrir Histórico del Plano">
                <div class="modulo-icono" data-color="gris">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Histórico</div>
                    <div class="modulo-desc">Movimientos del plano</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         CATEGORÍA: ACTIVO FIJO
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line" data-color="verde"></div>
            <h3>Activo Fijo</h3>
            <span class="categoria-badge">Módulo aislado</span>
        </div>

        <div class="modulos-grid">

            <!-- Catálogos AF -->
            <button class="modulo-card" data-modulo="activofijo_catalogos" data-color="verde"
                    aria-label="Abrir Catálogos de Activo Fijo">
                <div class="modulo-icono" data-color="verde">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Catálogos AF</div>
                    <div class="modulo-desc">Marcas, tipos, carteras</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Activo Fijo -->
            <button class="modulo-card" data-modulo="activofijo_activos" data-color="cian"
                    aria-label="Abrir Inventario de Activo Fijo">
                <div class="modulo-icono" data-color="cian">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Activo Fijo</div>
                    <div class="modulo-desc">Inventario físico</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Responsivas -->
            <button class="modulo-card" data-modulo="activofijo_responsivas" data-color="violeta"
                    aria-label="Abrir Responsivas">
                <div class="modulo-icono" data-color="violeta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Responsivas</div>
                    <div class="modulo-desc">Asignación a personas</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Reportes AF -->
            <button class="modulo-card" data-modulo="activofijo_reportes" data-color="naranja"
                    aria-label="Abrir Reportes">
                <div class="modulo-icono" data-color="naranja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Reportes</div>
                    <div class="modulo-desc">Dashboard y estadísticas</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <!-- Importar AF -->
            <button class="modulo-card" data-modulo="activofijo_importar" data-color="ambar"
                    aria-label="Abrir Importación Masiva">
                <div class="modulo-icono" data-color="ambar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Importar masivo</div>
                    <div class="modulo-desc">Carga por periférico</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         CATEGORÍA: ADMINISTRACIÓN
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line" data-color="rosa"></div>
            <h3>Administración</h3>
            <span class="categoria-badge">Sistema</span>
        </div>

        <div class="modulos-grid">
            <button class="modulo-card" data-modulo="usuarios" data-color="rosa"
                    aria-label="Abrir Usuarios">
                <div class="modulo-icono" data-color="rosa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Usuarios</div>
                    <div class="modulo-desc">Cuentas del sistema</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         FOOTER
         ========================================================= -->
    <footer class="app-footer">
        <span>Inventario Red y Equipos</span>
        <span class="footer-sep">·</span>
        <span>v1.0</span>
        <span class="footer-sep">·</span>
        <span>Coperva 2026</span>
    </footer>

    <script src="../js/menu-renderer.js"></script>
</body>
</html>
