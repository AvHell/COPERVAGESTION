<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>
    <!-- menu.css es autocontenido: NO depende de general.css -->
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <!-- =========================================================
         HEADER CORPORATIVO
         ========================================================= -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </div>
            <div class="brand-text">
                <h1>Inventario de Equipos</h1>
                <p>Sistema de gestión de red</p>
            </div>
        </div>

        <div class="user-card" id="user-card">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="user-name">Cargando…</div>
                <div class="user-role" id="user-role">—</div>
            </div>
            <button id="btn-salir" class="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Salir</span>
            </button>
        </div>
    </header>

    <!-- =========================================================
         GREETING
         ========================================================= -->
    <section class="greeting">
        <div class="greeting-text">
            <h2 id="saludo">Bienvenido</h2>
            <p id="bienvenida">Selecciona un módulo para comenzar</p>
        </div>
        <div class="greeting-date" id="fecha-hoy"></div>
    </section>

    <!-- =========================================================
         CATEGORÍA: CATÁLOGOS
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line"></div>
            <h3>Mapeo Red</h3>
        </div>

        <div class="modulos-grid">
            <button class="modulo-card" data-modulo="clientes" aria-label="Abrir Clientes">
                <div class="modulo-icono" data-color="azul">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Clientes</div>
                    <div class="modulo-desc">Gestión de clientes</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="roles" aria-label="Abrir Roles">
                <div class="modulo-icono" data-color="violeta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Roles</div>
                    <div class="modulo-desc">Roles de equipo</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="lugares" aria-label="Abrir Lugares">
                <div class="modulo-icono" data-color="verde">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M3 21h18"></path>
                        <path d="M5 21V7l8-4v18"></path>
                        <path d="M19 21V11l-6-4"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Lugares</div>
                    <div class="modulo-desc">Pisos por cliente</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="rangos" aria-label="Abrir Rangos IP">
                <div class="modulo-icono" data-color="naranja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Rangos IP</div>
                    <div class="modulo-desc">Rangos por cliente</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="equipos" aria-label="Abrir Equipos">
                <div class="modulo-icono" data-color="cian">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Equipos</div>
                    <div class="modulo-desc">Inventario técnico</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="dominios" aria-label="Abrir Dominios">
                <div class="modulo-icono" data-color="rosa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Dominios</div>
                    <div class="modulo-desc">Credenciales admin</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="configred" aria-label="Abrir Configuraciones de Red">
                <div class="modulo-icono" data-color="ambar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Config. de Red</div>
                    <div class="modulo-desc">Máscaras, DNS, gateways</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         CATEGORÍA: ACTIVO FIJO (MÓDULO AISLADO)
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line"></div>
            <h3>Activo Fijo</h3>
        </div>

        <div class="modulos-grid">
            <button class="modulo-card" data-modulo="activofijo_catalogos" aria-label="Abrir Catálogos de Activo Fijo">
                <div class="modulo-icono" data-color="verde">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Catálogos AF</div>
                    <div class="modulo-desc">Marcas, tipos, carteras</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="activofijo_activos" aria-label="Abrir Inventario de Activo Fijo">
                <div class="modulo-icono" data-color="cian">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Activo Fijo</div>
                    <div class="modulo-desc">Inventario físico</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="activofijo_responsivas" aria-label="Abrir Responsivas">
                <div class="modulo-icono" data-color="violeta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Responsivas</div>
                    <div class="modulo-desc">Asignación a personas</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="activofijo_reportes" aria-label="Abrir Reportes">
    <div class="modulo-icono" data-color="naranja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
    </div>
    <div class="modulo-info">
        <div class="modulo-titulo">Reportes</div>
        <div class="modulo-desc">Dashboard y estadísticas</div>
    </div>
    <div class="modulo-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </div>
</button>

<button class="modulo-card" data-modulo="activofijo_importar" aria-label="Abrir Importación Masiva">
    <div class="modulo-icono" data-color="ambar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
    </div>
    <div class="modulo-info">
        <div class="modulo-titulo">Importar masivo</div>
        <div class="modulo-desc">Carga por periférico</div>
    </div>
    <div class="modulo-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </div>
</button>
        </div>
    </section>

    <!-- =========================================================
         CATEGORÍA: PLANO
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line"></div>
            <h3>Plano</h3>
        </div>

        <div class="modulos-grid">
            <button class="modulo-card" data-modulo="plano" aria-label="Abrir Plano Visual">
                <div class="modulo-icono" data-color="azul">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Plano Visual</div>
                    <div class="modulo-desc">Mapa gráfico de equipos</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>

            <button class="modulo-card" data-modulo="historico" aria-label="Abrir Histórico del Plano">
                <div class="modulo-icono" data-color="gris">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Histórico</div>
                    <div class="modulo-desc">Movimientos del plano</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         CATEGORÍA: ADMINISTRACIÓN
         ========================================================= -->
    <section class="categoria">
        <div class="categoria-header">
            <div class="categoria-line"></div>
            <h3>Administración</h3>
            <span class="categoria-badge">Sistema</span>
        </div>

        <div class="modulos-grid">
            <button class="modulo-card" data-modulo="usuarios" aria-label="Abrir Usuarios">
                <div class="modulo-icono" data-color="violeta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <div class="modulo-info">
                    <div class="modulo-titulo">Usuarios</div>
                    <div class="modulo-desc">Cuentas del sistema</div>
                </div>
                <div class="modulo-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- =========================================================
         FOOTER
         ========================================================= -->
    <footer class="app-footer">
        <span>Inventario Red y Equipos · v1.0</span>
        <span class="footer-sep">·</span>
        <span>Coperva 2026</span>
    </footer>

    <script src="../js/menu-renderer.js"></script>
</body>
</html>
