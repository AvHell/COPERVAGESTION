<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plano Visual</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/plano.css">
</head>
<body class="plano-body">

    <!-- ========================================================= -->
    <!-- BARRA SUPERIOR -->
    <!-- ========================================================= -->
    <div class="barra-superior">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver
        </button>

        <div class="grupo-modo">
            <label for="select-modo">Vista:</label>
            <select id="select-modo">
                <option value="simple">Un piso</option>
                <option value="doble">Dos pisos (comparar)</option>
            </select>
        </div>

        <button id="btn-modo-zona" class="btn-modo">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
            </svg>
            Modo Zona
        </button>

        <button id="btn-limpiar-seleccion" class="secundario" style="display:none;">
            Limpiar selección
        </button>

        <button id="btn-exportar-pdf" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <polyline points="9 15 12 18 15 15"/>
            </svg>
            Exportar PDF
        </button>

        <button id="btn-toggle-lateral" class="secundario btn-toggle-lateral">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            Sin ubicar
            <span class="btn-toggle-badge" id="badge-toggle">0</span>
        </button>
    </div>

    <!-- ========================================================= -->
    <!-- LEYENDA DE ROLES -->
    <!-- ========================================================= -->
    <div class="leyenda-roles">
        <span class="titulo-leyenda">Roles:</span>
        <div class="leyenda-item"><span class="color-punto" style="background:#3b82f6;"></span><span class="codigo">AGT</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#22c55e;"></span><span class="codigo">SPR</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#f97316;"></span><span class="codigo">CLD</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#a855f7;"></span><span class="codigo">GRN</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#14b8a6;"></span><span class="codigo">CRD</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#ec4899;"></span><span class="codigo">MIS</span></div>
        <div class="leyenda-item"><span class="color-punto" style="background:#475569;"></span><span class="codigo">ADM</span></div>
    </div>

    <!-- ========================================================= -->
    <!-- CONTENEDOR PRINCIPAL -->
    <!-- ========================================================= -->
    <div class="contenedor-principal" id="contenedor-principal">

        <!-- Panel Izquierdo -->
        <div class="panel-plano" id="panel-izq">
            <div class="panel-encabezado">
                <div class="grupo-encabezado">
                    <label>Cliente</label>
                    <select id="select-cliente-izq"></select>
                </div>
                <div class="grupo-encabezado">
                    <label>Piso</label>
                    <select id="select-lugar-izq"></select>
                </div>
                <div class="grupo-encabezado grupo-dim">
                    <label>Filas</label>
                    <input type="number" id="input-filas-izq" min="1" max="30">
                </div>
                <div class="grupo-encabezado grupo-dim">
                    <label>Cols</label>
                    <input type="number" id="input-columnas-izq" min="1" max="30">
                </div>
                <button id="btn-aplicar-dim-izq" class="secundario btn-aplicar-dim">Aplicar</button>
            </div>
            <div class="plano-wrapper">
                <div id="grid-izq" class="grid-plano"></div>
            </div>
        </div>

        <!-- Panel Derecho (comparación) -->
        <div class="panel-plano panel-comparacion" id="panel-der" style="display:none;">
            <div class="panel-encabezado">
                <div class="grupo-encabezado">
                    <label>Cliente</label>
                    <select id="select-cliente-der"></select>
                </div>
                <div class="grupo-encabezado">
                    <label>Piso</label>
                    <select id="select-lugar-der"></select>
                </div>
                <div class="grupo-encabezado grupo-dim">
                    <label>Filas</label>
                    <input type="number" id="input-filas-der" min="1" max="30">
                </div>
                <div class="grupo-encabezado grupo-dim">
                    <label>Cols</label>
                    <input type="number" id="input-columnas-der" min="1" max="30">
                </div>
                <button id="btn-aplicar-dim-der" class="secundario btn-aplicar-dim">Aplicar</button>
            </div>
            <div class="plano-wrapper">
                <div id="grid-der" class="grid-plano"></div>
            </div>
        </div>

    </div>

    <!-- ========================================================= -->
    <!-- PANEL LATERAL COLAPSABLE -->
    <!-- ========================================================= -->
    <aside class="panel-lateral" id="panel-lateral">
        <div class="lateral-header">
            <div class="lateral-titulo">
                <h3>Equipos sin ubicar</h3>
                <button id="btn-cerrar-lateral" class="btn-cerrar-lateral" title="Cerrar panel">✕</button>
            </div>
            <div class="lateral-buscador">
                <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="buscador-lateral" placeholder="Buscar hostname...">
            </div>
        </div>

        <div class="lateral-tabs" id="lateral-tabs"></div>

        <div class="lateral-filtros-rol" id="lateral-filtros-rol">
            <button class="filtro-rol-chip todos activo" data-rol="__todos__">Todos</button>
            <button class="filtro-rol-chip" data-rol="AGT">AGT</button>
            <button class="filtro-rol-chip" data-rol="SPR">SPR</button>
            <button class="filtro-rol-chip" data-rol="CLD">CLD</button>
            <button class="filtro-rol-chip" data-rol="GRN">GRN</button>
            <button class="filtro-rol-chip" data-rol="CRD">CRD</button>
            <button class="filtro-rol-chip" data-rol="MIS">MIS</button>
            <button class="filtro-rol-chip" data-rol="ADM">ADM</button>
        </div>

        <div class="lista-sin-ubicar-wrapper">
            <ul class="lista-sin-ubicar" id="lista-sin-ubicar"></ul>
        </div>

        <div class="zonas-wrapper">
            <h3 class="zonas-titulo">Zonas del piso activo</h3>
            <ul id="lista-zonas" class="lista-zonas"></ul>
        </div>
    </aside>

    <div id="lateral-backdrop" class="lateral-backdrop" style="display:none;"></div>

    <!-- ========================================================= -->
    <!-- MODAL CONFIRMACIÓN GENERAL -->
    <!-- ========================================================= -->
    <div id="modal" class="modal-overlay" style="display:none;">
        <div class="modal-caja">
            <h3 id="modal-titulo">Confirmar acción</h3>
            <div id="modal-texto"></div>
            <div class="modal-acciones">
                <button id="modal-cancelar" class="secundario">Cancelar</button>
                <button id="modal-aceptar">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- MODAL ZONA -->
    <!-- ========================================================= -->
    <div id="modal-zona" class="modal-overlay" style="display:none;">
        <div class="modal-caja">
            <h3 id="modal-zona-titulo">Nueva zona</h3>
            <div class="campo-zona">
                <label for="zona-nombre">Nombre (ej. Mesa 1, Entrada, Extintor)</label>
                <input type="text" id="zona-nombre" maxlength="100" placeholder="Mesa 1">
            </div>
            <div class="campo-zona">
                <label>Color</label>
                <div class="colores-zona" id="colores-zona"></div>
            </div>
            <p id="zona-rango" style="font-size:0.85rem;color:#7f8c8d;margin-top:8px;"></p>
            <div class="modal-acciones">
                <button id="modal-zona-cancelar" class="secundario">Cancelar</button>
                <button id="modal-zona-aceptar">Guardar</button>
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- MODAL MOVER ENTRE PISOS -->
    <!-- ========================================================= -->
    <div id="modal-mover-piso" class="modal-overlay" style="display:none;">
        <div class="modal-caja modal-grande">
            <h3 id="mover-titulo">Mover equipo entre pisos</h3>

            <div class="info-mover" id="mover-info"></div>

            <div class="check-mantener">
                <label>
                    <input type="checkbox" id="chk-mantener" checked>
                    Mantener datos del equipo (hostname, IP, cliente, red)
                </label>
            </div>

            <div id="form-editar-mover" style="display:none;">
                <div class="seccion-titulo">Editar datos del equipo</div>

                <div class="grid-form">
                    <div>
                        <label for="mv-cliente">Cliente</label>
                        <select id="mv-cliente"></select>
                    </div>
                    <div>
                        <label for="mv-lugar">Lugar (destino)</label>
                        <select id="mv-lugar" disabled></select>
                    </div>
                    <div>
                        <label for="mv-rol">Rol</label>
                        <select id="mv-rol"></select>
                    </div>
                </div>

                <div class="grid-form">
                    <div>
                        <label for="mv-tipoIP">Tipo IP</label>
                        <select id="mv-tipoIP">
                            <option value="Estatica">Estática</option>
                            <option value="DHCP">DHCP</option>
                        </select>
                    </div>
                    <div>
                        <label for="mv-hostname">Hostname</label>
                        <input type="text" id="mv-hostname">
                    </div>
                    <div>
                        <label for="mv-ip">IP</label>
                        <input type="text" id="mv-ip">
                    </div>
                </div>

                <div class="grid-form">
                    <div>
                        <label for="mv-mascara">Máscara</label>
                        <input type="text" id="mv-mascara">
                    </div>
                    <div>
                        <label for="mv-puerta">Puerta de enlace</label>
                        <input type="text" id="mv-puerta">
                    </div>
                    <div>
                        <label for="mv-dns1">DNS 1</label>
                        <input type="text" id="mv-dns1">
                    </div>
                    <div>
                        <label for="mv-dns2">DNS 2</label>
                        <input type="text" id="mv-dns2">
                    </div>
                </div>

                <div class="grid-form">
                    <div>
                        <label for="mv-usuario">Usuario admin</label>
                        <input type="text" id="mv-usuario">
                    </div>
                    <div>
                        <label for="mv-password">Password admin</label>
                        <input type="text" id="mv-password">
                    </div>
                </div>

                <div id="mover-mensaje" class="mensaje" style="display:none;"></div>
            </div>

            <div class="modal-acciones">
                <button id="mover-cancelar" class="secundario">Cancelar</button>
                <button id="mover-confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../js/plano-renderer.js"></script>
</body>
</html>
