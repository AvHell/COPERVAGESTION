<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rangos IP</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/rangos.css">
</head>
<body>
    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">← Volver al menú</button>
        <button id="btn-nuevo">+ Nuevo rango</button>
    </div>

    <h2>Rangos IP</h2>

    <div class="contenedor-form" id="formulario" style="display:none;">
        <div class="fila-form doble">
            <div>
                <label for="cliente">Cliente</label>
                <select id="cliente"></select>
            </div>
            <div>
                <label for="lugar">Lugar</label>
                <select id="lugar"></select>
            </div>
        </div>

        <div class="fila-form">
            <div>
                <label for="nombre">Nombre del rango</label>
                <input type="text" id="nombre" placeholder="Rango agentes piso 3">
            </div>
            <div>
                <label for="ipInicio">IP Inicio</label>
                <input type="text" id="ipInicio" placeholder="192.168.111.10">
            </div>
            <div>
                <label for="ipFin">IP Fin</label>
                <input type="text" id="ipFin" placeholder="192.168.111.50">
            </div>
            <div>
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" placeholder="Opcional">
            </div>
            <div>
                <button id="btn-guardar">Guardar</button>
                <button id="btn-cancelar" class="secundario">Cancelar</button>
            </div>
        </div>

        <div id="mensaje" class="mensaje" style="display:none;"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Lugar</th>
                <th>Nombre</th>
                <th>IP Inicio</th>
                <th>IP Fin</th>
                <th style="width:180px;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-rangos"></tbody>
    </table>

    <script src="../js/rangos-renderer.js"></script>
</body>
</html>
