<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- SweetAlert2 por CDN (versión flotante 11) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Estilos autocontenidos -->
    <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>

    <!-- =========================================================
         BARRA SUPERIOR
         ========================================================= -->
    <div class="barra-acciones">
        <button id="btn-volver" class="secundario">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver al menú
        </button>

        <button id="btn-nuevo">
            <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nuevo usuario
        </button>
    </div>

    <h2>Usuarios del Sistema</h2>
    <p class="subtitulo-seccion">Cuentas con acceso al sistema. Los usuarios desactivados no podrán iniciar sesión.</p>

    <!-- =========================================================
         ESTADO VACÍO
         ========================================================= -->
    <div id="sin-resultados" class="sin-resultados oculto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No hay usuarios registrados.</p>
    </div>

    <!-- =========================================================
         TABLA
         ========================================================= -->
    <div class="card-tabla">
        <table class="tabla-usuarios">
            <thead>
                <tr>
                    <th style="width:22%;">Usuario</th>
                    <th style="width:24%;">Nombres</th>
                    <th style="width:24%;">Apellidos</th>
                    <th style="width:120px;">Estado</th>
                    <th style="width:200px; text-align:right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios"></tbody>
        </table>
    </div>

    <!-- =========================================================
         MODAL DE USUARIO
         ========================================================= -->
    <div id="modal-usuario" class="modal-overlay" style="display:none;">
        <div class="modal-usuario">
            <div class="modal-header">
                <h3 id="modal-usuario-titulo">Nuevo usuario</h3>
                <button id="modal-usuario-cerrar" class="btn-cerrar-modal" title="Cerrar">✕</button>
            </div>

            <form id="formulario" autocomplete="off">
                <div class="modal-body">
                    <div class="grid-form">
                        <div>
                            <label for="nombres">Nombres *</label>
                            <input type="text" id="nombres" maxlength="100" placeholder="Juan" required>
                        </div>
                        <div>
                            <label for="apellidos">Apellidos *</label>
                            <input type="text" id="apellidos" maxlength="100" placeholder="Pérez" required>
                        </div>
                        <div>
                            <label for="nombreUsuario">Nombre de usuario *</label>
                            <input type="text" id="nombreUsuario" maxlength="50" placeholder="jperez" required>
                        </div>
                        <div class="grid-form-full">
                            <label for="password">Contraseña <span id="ayuda-password">(obligatoria al crear)</span></label>
                            <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
                        </div>
                    </div>
                    <div id="mensaje" class="mensaje oculto"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-cancelar" class="secundario">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-guardar">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/usuarios-renderer.js"></script>
</body>
</html>
